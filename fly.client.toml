# fly.toml app configuration file generated for arp-api on 2026-11-15T14:14:20+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'arp-client'
primary_region = 'fra'

[build]
dockerfile = 'client.Dockerfile'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '256mb'
cpus = 1
memory_mb = 512
